name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # ビルドしてから成果物を検査する（dist は build で生成される）
      - run: npm run build:prod

      # ビルド成果物にモデルデータが混入していないことを検査する。
      # 本プロジェクトはモデルを同梱しない方針のため、混入は公開時の
      # ライセンス違反になり得る。
      - name: Ensure no model data is bundled
        run: |
          set -e
          found=$(find dist \( -iname '*.moc3' -o -iname '*.model3.json' \
               -o -iname 'texture_*.png' -o -iname '*.motion3.json' \
               -o -iname '*.exp3.json' \) -print)
          if [ -n "$found" ]; then
            echo "::error::ビルド成果物にモデルデータが含まれています"
            echo "$found" | head
            exit 1
          fi
          echo "モデルデータの混入なし"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
